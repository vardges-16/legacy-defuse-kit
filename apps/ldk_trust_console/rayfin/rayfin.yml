id: ldk-trust-console
name: ldk_trust_console
version: 1.0.0
services:
  auth:
    enabled: true
    fabric:
      enabled: true
      externalEntraExchange: true
    password:
      enabled: false
    allowedRedirectUris:
      - http://localhost:5173
      - http://127.0.0.1:5173
      - https://velvet-knot-914e296bc6-swedencentral.webapp.fabricapps.net
  data:
    enabled: false
    path: packages/data
    buildCommand: npm run build
  staticHosting:
    enabled: true
    path: packages/frontend
    folder: dist
    buildCommand: npm run build:fabric
    indexDocument: index.html
    assetAccess: protected
    embedded:
      only: false
  storage:
    enabled: false
  functions:
    enabled: false
connectors:
  - name: trust
    type: fabric-sqlanalytics
    config:
      workspaceId: 84598118-e0d7-451b-b901-affefb6f0cca
      itemId: ee4214a1-ece7-480e-a54d-b32a16fe879d
    auth:
      type: delegated
    operations:
      - name: read
